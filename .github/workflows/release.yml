name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest version
        run: |
          node -e "const m=require('./manifest.json'); if ('v'+m.version !== process.env.GITHUB_REF_NAME) { console.error('tag/manifest version mismatch'); process.exit(1) }"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            manifest.json theme.css theme-dark.css export.css preview.jpg README.md LICENSE \
            --title "蓝托帕石 $GITHUB_REF_NAME" \
            --generate-notes
